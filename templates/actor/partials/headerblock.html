

    {{!-- Character Picture --}}
    {{#if (eq actor.type "character")}}
<header>
    <div class="headroom">
        <div style="max-height: 358px;">
            <img class="profile-img" src="{{actor.img}}" data-action="editImage" data-field="img" title="{{actor.name}}"/>
        </div>
    </div>
</header>
    {{else}}
<header>
    <div class="headroom">
        <div style="max-height: 358px;">
            <img class="profile-img" src="{{actor.img}}" data-action="editImage" data-field="img"
            title="{{actor.name}}"/>
        </div>
    </div>
    <div class="contentBox" style="background-color: var(--pitchBorder); min-height: 180px;">
        <div class="flexrow">
            <h3 class="subheader colorV1">{{localize 'ep2e.actorSheet.aptitudes.headline'}}</h3>
            <div class="flexGrowHalf">
            </div>
        </div>
        <div class="listBackground shape2 grid grid-3col noMargin">
            {{#each actor.system.aptitudes as |aptitude key|}}
            <div class="flexrow flex-group-center reveal standard-height">
                <div class="flexrow flex-group-center input-small">
                    <span class="toggle resource-value alignCenter" style=" min-width: 26px;">{{localize aptitude.label}}</span>
                    <label class="toggle roll-label task-check noShow" data-type="skill" data-name="{{localize aptitude.name}}" data-key="system.aptitudes.{{key}}.value" data-apttype="{{key}}" data-rollvalue="{{aptitude.roll}}"><img src="icons/svg/d10-grey.svg" class="icon-small"/></label>
                </div>
                <input class="input-small" type="number" onFocus="this.select()" name="system.aptitudes.{{key}}.value" value="{{aptitude.value}}" data-dtype="Number" placeholder="0"/>
            </div>
            {{/each}}
        </div>
    </div>
</header>
    {{/if}}
