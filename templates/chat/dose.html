<div class="alignCenter">
  <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 15px 10px {{#if rows.length}}0{{else}}15px{{/if}} 10px;">
    <i class="fa-solid {{icon}}" style="font-size: 36px; color: var({{color}});"></i>
    <div style="text-align: center; font-size: 14px;">{{{headline}}}</div>
  </div>

  {{#if rows.length}}
  <div style="display: block; margin: 15px 0 20px 0; padding: 15px 0; background-color: var(--pitchBorder);">
    <div style="font-size: 14px; line-height: 1.6;">
      {{#each rows as |row|}}
      {{#if row.label}}<span>{{row.label}}: <b>{{row.value}}</b></span>{{else}}<span><i>{{row.value}}</i></span>{{/if}}<br>
      {{/each}}
    </div>
  </div>
  {{/if}}

  {{#if footnote}}
  <p style="font-size: 11px; color: var(--inactive); margin: -10px 0 10px 0;">{{footnote}}</p>
  {{/if}}

  {{#if addiction}}
  <div class="chatControls dose-addiction gmOnlyControl">
    <button type="button" class="chatButton demandWillpower ep-chat-secondary" data-action="demandWillpower" data-actor-uuid="{{addiction.actorUuid}}" data-drug="{{addiction.name}}">{{localize "ep2e.chat.dose.demandWillpower"}}</button>
    <a class="doseHistory" data-actor-uuid="{{addiction.actorUuid}}" data-drug="{{addiction.name}}" data-tooltip="{{localize 'ep2e.chat.dose.doseHistoryTip'}}"><i class="fa-regular fa-circle-info awesomeIcon"></i></a>
  </div>
  {{/if}}

  {{#if button}}
  <div class="chatControls ep-chat-stack">
    <button type="button" class="chatButton {{button.action}} ownerOnlyControl ep-chat-primary" data-action="{{button.action}}" data-actor-uuid="{{actorUuid}}">{{button.label}}</button>
  </div>
  {{/if}}

  {{#if offer}}
  <div class="chatControls ep-chat-stack">
    <button type="button" class="chatButton useDose playerOnlyControl notForOwnerControl" data-action="useDose" data-actor-uuid="{{actorUuid}}">{{localize "ep2e.chat.dose.useOnMe"}}</button>
    <button type="button" class="chatButton useDose gmOnlyControl ep-chat-secondary" data-action="useDose" data-selection="true">{{localize "ep2e.chat.dose.useOnSelection"}}</button>
    <button type="button" class="chatButton pickDoseNpc gmOnlyControl ep-chat-secondary" data-action="pickDoseNpc">{{localize "ep2e.chat.dose.chooseNpc"}}</button>
    <button type="button" class="chatButton pickDoseTarget gmOnlyControl ep-chat-primary" data-action="pickDoseTarget" data-actor-uuid="{{actorUuid}}">{{localize "ep2e.chat.dose.chooseTarget"}}</button>
  </div>
  {{/if}}
</div>
